<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0e5a48" />
    <title>الصفوة للخدمات الحكومية والإلكترونية — منيا القمح</title>
    <meta
      name="description"
      content="مكتب الصفوة لمتابعة المعاملات والتراخيص الحكومية في منيا القمح والعزيزية — الشرقية. اعرف الأوراق المطلوبة، قدّم طلبك، وتابع معاملتك برقمها."
    />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        // Light is the default; dark only when the user picked it (or chose "system" on a dark OS).
        var pref = localStorage.getItem('elsafwa.theme.v2');
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
